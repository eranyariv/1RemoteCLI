# Builds the two Windows agents and publishes them as a GitHub Release.
#
# Tag-driven rather than push-driven: a release is a thing somebody decides to make,
# and every main build producing one would leave users unable to tell which download
# is the one anybody else is running.
#
# The binaries are NOT signed. There is no code-signing certificate for this project,
# so SmartScreen warns the first time one is run from Explorer, and the SHA-256 of
# each file is published beside it -- that hash is the only way a user can check that
# what they downloaded is what this workflow built. scripts/install.ps1 verifies it
# for them.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Read once, checked once, used by both jobs. The version is not an input: it is
  # whatever VERSION says, because that is the number the binaries will be stamped
  # with regardless of what a tag or a form field claims.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: v${{ steps.read.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: read
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < VERSION)

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]{2}$ ]]; then
            echo "VERSION holds '$version', which is not x.yy."
            exit 1
          fi

          # A tag that disagrees with the file would produce a release called one
          # thing containing binaries that call themselves another.
          if [ '${{ github.ref_type }}' = 'tag' ] && [ "${{ github.ref_name }}" != "v$version" ]; then
            echo "Tagged ${{ github.ref_name }} but VERSION says $version. Bump VERSION first."
            exit 1
          fi

          if ! grep -Fq "id=\"v$version\"" src/PWA/public/change-history.html; then
            echo "change-history.html has no v$version entry. Document the release before tagging it."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    # Both runtimes are cross-published from the same x64 runner. win-arm64 has no
    # hosted runner, and does not need one: the publish is a cross-compile and the
    # tests that would actually exercise the architecture already run in CI.
    runs-on: windows-latest
    strategy:
      # One architecture failing must not leave the other half-released.
      fail-fast: true
      matrix:
        runtime: [win-x64, win-arm64]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The same script used to publish by hand, so a release is never built by a
      # path nobody has run locally. It takes no version: the build reads VERSION.
      - name: Publish
        shell: pwsh
        run: |
          ./scripts/publish-agent.ps1 `
            -Runtime ${{ matrix.runtime }} `
            -Output ${{ github.workspace }}/release/${{ matrix.runtime }}

      # Cheap, and it catches the failure mode that matters: a build whose stamped
      # version does not match the release it is about to be published under.
      - name: Check the stamp
        shell: pwsh
        run: |
          $exe = '${{ github.workspace }}/release/${{ matrix.runtime }}/1remote.exe'
          $expected = '${{ needs.version.outputs.version }}'

          if ('${{ matrix.runtime }}' -ne 'win-x64') {
            Write-Host "Skipping: cannot run a $('${{ matrix.runtime }}') build here."
            exit 0
          }

          $actual = (& $exe --version).Trim()

          if ($actual -ne $expected) {
            throw "The build says $actual, VERSION says $expected."
          }

          Write-Host "Stamped $actual."

      # Named by architecture, because both end up in one release and '1remote.exe'
      # twice would be indistinguishable in the assets list -- and downloading the
      # wrong one fails at launch with an error that says nothing about architecture.
      - name: Name it after its architecture
        shell: pwsh
        run: |
          $dir = '${{ github.workspace }}/release/${{ matrix.runtime }}'
          $named = "$dir/1remote-${{ matrix.runtime }}.exe"

          Move-Item "$dir/1remote.exe" $named

          $hash = (Get-FileHash $named -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  1remote-${{ matrix.runtime }}.exe" | Set-Content "$dir/1remote-${{ matrix.runtime }}.exe.sha256" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.runtime }}
          path: ${{ github.workspace }}/release/${{ matrix.runtime }}/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest

    steps:
      # Deliberately no checkout. The release notes are written here rather than read
      # from the repository, and a working tree only creates directories for the
      # asset glob to collide with -- which it did: 'assets' is also a tracked folder
      # of icons, and the first release shipped all of them.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: agent-*
          merge-multiple: true

      # One file the install script can fetch to learn both hashes, rather than
      # guessing at asset names.
      - name: Gather the hashes
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          cat SHA256SUMS.txt

      # gh rather than a third-party release action: it is already on the runner, it
      # uses the token this workflow was granted rather than one handed to somebody
      # else's code, and publishing a release is the one step here that is hard to
      # take back.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag='${{ needs.version.outputs.tag }}'

          # Exactly the three files, named, rather than a glob: a release is public and
          # permanent, and shipping something nobody meant to is not recoverable by
          # editing it afterwards.
          for file in 1remote-win-x64.exe 1remote-win-arm64.exe SHA256SUMS.txt; do
            test -f "dist/$file" || { echo "dist/$file is missing."; exit 1; }
          done

          {
            echo '## Install'
            echo
            echo 'In PowerShell:'
            echo
            echo '```powershell'
            echo 'irm https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.ps1 | iex'
            echo '```'
            echo
            echo "That downloads the build for this machine's architecture, checks it against the"
            echo 'hash below, puts it in `%LOCALAPPDATA%\Programs\1RemoteCLI`, registers the logon'
            echo 'task, adds it to your `PATH` and starts the agent -- so its icon is in the'
            echo 'notification area when the install finishes, rather than after your next logon.'
            echo 'Then open a new terminal and run `1remote login`.'
            echo
            echo 'To install by hand instead, download the executable for your architecture and run'
            echo '`1remote install` from wherever you put it.'
            echo
            echo '## Checksums'
            echo
            echo 'These builds are unsigned, so Windows will warn the first time one runs. Check'
            echo 'what you downloaded against the hash for it:'
            echo
            echo '```powershell'
            echo 'Get-FileHash .\1remote-win-x64.exe -Algorithm SHA256'
            echo '```'
            echo
            echo '| File | SHA-256 |'
            echo '| --- | --- |'
            while read -r hash name; do
              printf '| `%s` | `%s` |\n' "$name" "$hash"
            done < dist/SHA256SUMS.txt
          } > notes.md

          gh release create "$tag" \
            dist/1remote-win-x64.exe \
            dist/1remote-win-arm64.exe \
            dist/SHA256SUMS.txt \
            --repo '${{ github.repository }}' \
            --title "$tag" \
            --notes-file notes.md
